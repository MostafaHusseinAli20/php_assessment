version: "3.8"

services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: php_assessment_app

    working_dir: /var/www

    volumes:
      - ./:/var/www

    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:latest

    container_name: php_assessment_nginx

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

  postgres:
    image: postgres:16

    container_name: php_assessment_postgres

    restart: always

    environment:
      POSTGRES_DB: php_assessment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: php_assessment_redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: